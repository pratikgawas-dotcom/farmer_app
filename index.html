egation in the browser.",tech:["React","localStorage","Recharts","CSS"],outcome:"A working budgeting app with category charts, filters and CSV export.",steps:["Define the data model: id, amount, type, category, date, note.","Build an add-transaction form with validation.","Persist transactions in localStorage and hydrate on load.","Compute monthly totals by category with a reduce.","Render a bar chart for monthly spend and a pie chart for categories.","Add edit/delete and CSV export."],tags:["React","Forms","Charts"]},{id:"p-realtime-chat",title:"Real-time Chat App",category:"Web Development",difficulty:"Intermediate",duration:"3 weeks",description:"Multi-room chat with presence, typing indicators and message history. The classic project that proves you understand sockets and state synchronisation.",tech:["React","Node.js","Socket.IO","MongoDB","JWT"],outcome:"A deployed chat app where two browsers exchange messages instantly with auth.",steps:["Model users, rooms and messages; decide what is stored vs transient.","Build the Express + Socket.IO server with JWT auth on the handshake.","Create the React client with a room list and message pane.","Emit and broadcast message, typing and presence events.","Persist messages to MongoDB and paginate history on room join.","Deploy the server (Render) and client (Vercel); test with two devices."],tags:["Sockets","Node.js","Auth"]},{id:"p-url-shortener",title:"URL Shortener with Analytics",category:"Web Development",difficulty:"Advanced",duration:"3–4 weeks",description:"A production-shaped service: short links, custom slugs, click analytics and rate limiting. Good for learning caching, indexing and API design.",tech:["Node.js","PostgreSQL","Redis","Docker","React"],outcome:"A shortener handling redirects in <50ms with a dashboard of clicks by country and day.",steps:["Design the schema: links, clicks, users; index the slug column.","Implement base62 encoding or a collision-checked random slug.","Add a redirect endpoint that logs the click asynchronously.","Cache hot slugs in Redis with a TTL.","Build a dashboard showing clicks per day, referrer and device.","Add rate limiting and containerise the whole stack with Docker Compose."],tags:["Backend","Caching","Docker"]},{id:"p-design-system",title:"Component Library & Docs Site",category:"Web Development",difficulty:"Advanced",duration:"3 weeks",description:"Build a reusable React component library with tokens, accessibility and a documentation site. Directly mirrors the work of a design-systems team.",tech:["React","TypeScript","Storybook","CSS Variables"],outcome:"A published npm package with 12 accessible components and live documentation.",steps:["Define design tokens: colour, spacing, radius, type scale.","Build primitives: Button, Input, Select, Modal, Tooltip, Toast.","Add keyboard and ARIA support, then test with a screen reader.","Document each component in Storybook with usage notes.","Set up a build (tsup) and publish to npm as a scoped package.","Add a docs site that imports the package from npm, not source."],tags:["TypeScript","Design Systems","Open Source"]},{id:"p-mobile-app-ui",title:"Mobile App UI Redesign Case Study",category:"Web Development",difficulty:"Intermediate",duration:"2 weeks",description:"Pick a real Indian app with usability problems, audit it, redesign the core flow and publish the case study with before/after screens.",tech:["Figma","React (optional)","Framer"],outcome:"A case study PDF and interactive prototype that you can show in design interviews.",steps:["Choose an app and record 5 concrete usability issues with screenshots.","Interview 3 users about their biggest friction point.","Rebuild the core flow as wireframes, then a hi-fi prototype.","Test the prototype with 3 people and note what confused them.","Iterate once and document the decision log.","Publish on Notion/Medium with a 60-second walkthrough video."],tags:["Figma","Case Study","UX"]},{id:"p-image-classifier",title:"Image Classifier for Campus Waste",category:"AI/ML",difficulty:"Beginner",duration:"2 weeks",description:"Train a small CNN to sort waste into recyclable, organic and e-waste using a phone camera dataset you collect yourself.",tech:["Python","PyTorch","torchvision","Streamlit"],outcome:"A model with >85% validation accuracy served in a simple Streamlit demo.",steps:["Collect 300–600 labelled images across 3 classes.","Split train/val/test and apply augmentation (flip, crop, colour jitter).","Fine-tune a pretrained ResNet18 for 10 epochs.","Evaluate with a confusion matrix; inspect misclassified samples.","Export the model and wrap it in a Streamlit upload interface.","Document accuracy, failure modes and next steps in the README."],tags:["Computer Vision","PyTorch"]},{id:"p-rag-chatbot",title:"RAG Chatbot over College Documents",category:"AI/ML",difficulty:"Intermediate",duration:"3 weeks",description:"A retrieval-augmented chatbot that answers questions from your college handbook, syllabus PDFs and placement policy — with citations to the source page.",tech:["Python","LangChain","FAISS","OpenAI/Embeddings","FastAPI"],outcome:"A chatbot that answers 20 test questions correctly and cites the source document.",steps:["Collect and clean the PDFs; split into 500-token chunks with overlap.","Embed chunks and store them in FAISS with metadata (file, page).","Build a retriever and a prompt that forces answers only from context.","Add a FastAPI endpoint plus a small chat UI.","Create a 20-question evaluation set and measure answer accuracy.","Tune chunk size and top-k; log failures and fix the prompt."],tags:["LLM","RAG","Embeddings"]},{id:"p-recommender",title:"Course Recommendation Engine",category:"AI/ML",difficulty:"Advanced",duration:"4 weeks",description:"Hybrid recommender combining collaborative filtering with content similarity, evaluated offline with precision@k and served as an API.",tech:["Python","pandas","implicit","FastAPI","Docker"],outcome:"A recommender improving precision@10 over a popularity baseline, with an offline eval report.",steps:["Assemble an interaction dataset (or synthesise one with realistic noise).","Implement a popularity baseline and measure precision@k.","Train matrix factorisation (ALS) on implicit feedback.","Add TF-IDF content similarity on course descriptions.","Blend scores, tune weights on a validation split.","Serve via FastAPI, cache results, and write the evaluation report."],tags:["Recommenders","Evaluation","MLOps"]},{id:"p-resume-matcher",title:"Resume ↔ Job Description Matcher",category:"AI/ML",difficulty:"Intermediate",duration:"2 weeks",description:"Parse a resume and a job description, extract skills and score the match with an explanation of what is missing. Very relevant to placement season.",tech:["Python","spaCy","sentence-transformers","Streamlit"],outcome:"A tool that returns a match score, matched skills and missing keywords for any JD.",steps:["Extract text from PDF/DOCX resumes with pdfplumber and python-docx.","Build a skill gazetteer and match skills with spaCy PhraseMatcher.","Embed resume and JD sections with sentence-transformers.","Compute cosine similarity per section and combine into a score.","Show matched vs missing skills with a short explanation.","Validate on 10 real resumes and refine the skill list."],tags:["NLP","Embeddings","Placement"]},{id:"p-finetune-classifier",title:"Fine-tune a Small Language Model",category:"AI/ML",difficulty:"Advanced",duration:"4 weeks",description:"Fine-tune a small open model (e.g. a 1B-parameter model) on a domain dataset and compare against prompt-only baselines on a held-out set.",tech:["Python","Hugging Face","LoRA/PEFT","PyTorch","W&B"],outcome:"A reproducible fine-tune with a benchmark table showing improvement and cost.",steps:["Curate 1–3k instruction/response pairs from public data; clean them.","Establish a prompt-only baseline on 100 held-out examples.","Configure LoRA fine-tuning with a small batch size on a free GPU tier.","Track loss and evaluation metrics across runs.","Compare outputs blind and score them with a rubric.","Write up method, results, cost and limitations."],tags:["Fine-tuning","LoRA","Evaluation"]},{id:"p-ab-test",title:"A/B Test Analysis Toolkit",category:"AI/ML",difficulty:"Beginner",duration:"1 week",description:"Given experiment data, decide whether a change actually worked — with power analysis, p-values and confidence intervals explained in plain language.",tech:["Python","pandas","scipy","Jupyter"],outcome:"A notebook and one-page memo recommending ship / no-ship with reasoning.",steps:["Load the experiment dataset and check sample ratio mismatch.","Compute baseline conversion rate and required sample size.","Run a two-proportion z-test and a chi-square test.","Report confidence intervals, not just p-values.","Segment by device and new vs returning users.","Write the one-page recommendation memo."],tags:["Statistics","Experimentation"]},{id:"p-sales-dashboard",title:"Retail Sales Dashboard",category:"Data Science",difficulty:"Beginner",duration:"1–2 weeks",description:"Take a public retail dataset and build a dashboard a store manager could use: revenue trend, top products, regional split, stock alerts.",tech:["SQL","Power BI","Excel"],outcome:"A published dashboard with 5 visuals, filters and a written insight summary.",steps:["Download a public retail dataset and load it into a SQL database.","Clean duplicates, nulls and inconsistent categories.","Write queries for monthly revenue, growth and top SKUs.","Model the data in Power BI and build 5 visuals.","Add slicers for region, category and date range.","Write 5 insights a manager could act on this week."],tags:["SQL","BI","Dashboard"]},{id:"p-eda-notebook",title:"Public Dataset EDA Notebook",category:"Data Science",difficulty:"Beginner",duration:"1 week",description:"Pick a dataset you are curious about (cricket, air quality, OTT streaming) and produce a rigorous exploratory analysis with a clear narrative.",tech:["Python","pandas","Matplotlib","Seaborn"],outcome:"A clean notebook with a question → finding → chart structure and no dead cells.",steps:["Write 5 questions before touching the data.","Profile the dataset: shape, dtypes, missingness, duplicates.","Clean and document every transformation.","Answer each question with one chart and one sentence.","Check at least one surprising finding for a data artefact.","Publish on Kaggle or GitHub with a README summary."],tags:["EDA","pandas","Storytelling"]},{id:"p-demand-forecast",title:"Demand Forecasting for a Local Store",category:"Data Science",difficulty:"Intermediate",duration:"3 weeks",description:"Forecast daily demand for a product category and compare classical time-series models with gradient boosting. Includes backtesting.",tech:["Python","statsmodels","LightGBM","pandas"],outcome:"A backtested forecast with MAPE reported against a naive baseline.",steps:["Get 2+ years of daily sales data (or a public retail dataset).","Build features: lags, rolling means, weekday, holidays, promotions.","Fit a seasonal naive baseline and record MAPE.","Fit SARIMA and LightGBM; compare on a rolling backtest.","Analyse residuals for missing seasonality or outliers.","Present the forecast with an uncertainty band."],tags:["Time Series","Forecasting"]},{id:"p-churn-model",title:"Customer Churn Prediction & Retention Plan",category:"Data Science",difficulty:"Advanced",duration:"3–4 weeks",description:"Predict churn, quantify the revenue at risk, and translate the model into a targeted retention campaign with expected ROI.",tech:["Python","scikit-learn","SHAP","Power BI"],outcome:"A model with lift over baseline plus a campaign plan with estimated ROI.",steps:["Define churn precisely and build a leakage-free feature set.","Handle class imbalance (class weights / resampling).","Train logistic regression and gradient boosting; compare ROC-AUC and lift.","Explain drivers with SHAP and segment at-risk users.","Estimate revenue at risk and cost of the intervention.","Deliver a one-page retention plan with targeting rules."],tags:["Classification","SHAP","Business"]},{id:"p-streaming-pipeline",title:"Streaming Data Pipeline",category:"Data Science",difficulty:"Advanced",duration:"4 weeks",description:"Ingest simulated clickstream events, process them in near real time and surface live metrics on a dashboard.",tech:["Python","Kafka","Spark","Docker","Grafana"],outcome:"A pipeline sustaining ~1k events/sec with a live dashboard of 3 metrics.",steps:["Simulate clickstream events with a producer script.","Stand up Kafka locally with Docker Compose.","Consume with Spark Structured Streaming and window the aggregates.","Write results to a sink (Postgres or Parquet).","Connect Grafana to the sink and build 3 live panels.","Measure throughput and add a backpressure strategy."],tags:["Kafka","Spark","Streaming"]},{id:"p-survey-insights",title:"Student Survey Insight Report",category:"Data Science",difficulty:"Intermediate",duration:"2 weeks",description:"Run a real survey with 100+ responses in your college, analyse it properly and present a report with recommendations to the administration.",tech:["Google Forms","Python","pandas","Canva/PDF"],outcome:"A published 6-page report with validated findings and 3 recommendations.",steps:["Design 12 questions with no leading wording; pilot with 5 people.","Collect 100+ responses across departments.","Clean responses and check for straight-lining or duplicates.","Cross-tabulate by year and branch; test key differences.","Build 4 charts that each make one point.","Write recommendations the college could actually implement."],tags:["Survey","Analysis","Communication"]},{id:"p-iot-monitor",title:"Smart Room Monitor",category:"IoT",difficulty:"Beginner",duration:"1–2 weeks",description:"An ESP32 that measures temperature, humidity and light, then pushes readings to a live web dashboard with alerts.",tech:["ESP32","DHT22","Arduino C++","MQTT","Node-RED"],outcome:"A working device streaming data every 30s to a dashboard with threshold alerts.",steps:["Wire the DHT22 and LDR to the ESP32; verify with a serial monitor.","Publish readings over MQTT to a local broker.","Build a Node-RED flow to store readings and draw a gauge.","Add threshold alerts (too hot / too dark) via email or Telegram.","Enclose the device and test a 24-hour run for stability.","Document wiring diagrams and the bill of materials."],tags:["ESP32","MQTT","Sensors"]},{id:"p-smart-irrigation",title:"Soil-Moisture Smart Irrigation",category:"IoT",difficulty:"Intermediate",duration:"3 weeks",description:"Automatically water a plant only when soil moisture drops below a threshold, with a schedule override and a water-usage log.",tech:["ESP32","Capacitive sensor","Relay","Firebase","React"],outcome:"A system that keeps a plant alive for 2 weeks unattended and logs every watering.",steps:["Calibrate the soil sensor (dry vs wet ADC values).","Control a relay-driven pump with a safe power circuit.","Implement hysteresis so the pump does not chatter.","Sync state and logs to Firebase Realtime Database.","Build a React panel for manual override and history.","Run a 14-day field test and tune thresholds."],tags:["Automation","Firebase","ESP32"]},{id:"p-fleet-tracker",title:"Vehicle Fleet Tracker",category:"IoT",difficulty:"Advanced",duration:"4 weeks",description:"GPS telemetry from a moving device, geofencing, trip detection and a live map. A realistic logistics product slice.",tech:["ESP32","GPS module","GSM/WiFi","AWS IoT Core","React Leaflet"],outcome:"A live map with trip history, geofence alerts and per-vehicle analytics.",steps:["Parse NMEA sentences from the GPS module and validate fixes.","Batch points and publish over MQTT with device certificates.","Ingest into AWS IoT Core → Lambda → DynamoDB.","Detect trips and stops from speed and time thresholds.","Render a live map with Leaflet and a trip history view.","Add geofence entry/exit alerts and a battery/power budget."],tags:["GPS","AWS IoT","Maps"]},{id:"p-wearable-health",title:"Wearable Health Band Prototype",category:"IoT",difficulty:"Advanced",duration:"4 weeks",description:"Pulse and step tracking on a low-power microcontroller, with sleep-mode optimisation and a mobile-friendly dashboard.",tech:["ESP32-C3","MAX30102","MPU6050","BLE","React"],outcome:"A wearable reading pulse and steps with 2+ days of battery life.",steps:["Read pulse and accelerometer data; filter noise in firmware.","Implement step counting with a peak-detection algorithm.","Stream over BLE to a companion web app (Web Bluetooth).","Add deep sleep between samples to extend battery life.","Chart pulse and steps over the day.","Measure battery runtime and document trade-offs."],tags:["BLE","Low Power","Health"]},{id:"p-campus-parking",title:"Smart Campus Parking System",category:"IoT",difficulty:"Intermediate",duration:"3 weeks",description:"Detect free parking slots with ultrasonic sensors and show live availability to students before they drive in.",tech:["Arduino","Ultrasonic sensors","Node.js","WebSockets","React"],outcome:"A live slot map that updates within 2 seconds of a car arriving or leaving.",steps:["Prototype one slot with an ultrasonic sensor and threshold logic.","Scale to 4 slots and debounce false readings.","Send state changes to a Node.js server over WebSockets.","Build a slot grid UI with green/red states.","Add a 7-day history chart of occupancy.","Test with real vehicles and tune the distance threshold."],tags:["Sensors","WebSockets","Arduino"]},{id:"p-air-quality",title:"City Air Quality Network",category:"IoT",difficulty:"Beginner",duration:"2 weeks",description:"Two low-cost air quality nodes reporting PM2.5 and AQI to a shared dashboard, with a comparison between locations.",tech:["ESP32","PMS5003","ThingSpeak","Python"],outcome:"A 7-day AQI dataset from two locations with a comparison chart.",steps:["Connect the PMS5003 sensor and read PM2.5/PM10 values.","Convert raw readings to an AQI category.","Publish to ThingSpeak every minute.","Place two nodes in different micro-environments.","Pull the data with Python and chart hourly trends.","Write a short note on what the data does and does not prove."],tags:["Environment","Data","Sensors"]},{id:"p-serverless-api",title:"Serverless Notes API",category:"Cloud",difficulty:"Beginner",duration:"1–2 weeks",description:"A fully serverless CRUD API with authentication, deployed with infrastructure as code and a free-tier cost of zero.",tech:["AWS Lambda","API Gateway","DynamoDB","Terraform"],outcome:"A live HTTPS API with auth, documented in a README, provisioned by Terraform.",steps:["Define the API contract (routes, payloads, errors).","Create a DynamoDB table with a partition key and GSI.","Write Lambda handlers and test them locally.","Wire API Gateway routes and Cognito/JWT auth.","Provision everything with Terraform modules.","Tear down and re-apply to prove it is reproducible."],tags:["AWS","Serverless","Terraform"]},{id:"p-cicd-pipeline",title:"CI/CD Pipeline with Preview Deploys",category:"Cloud",difficulty:"Intermediate",duration:"2–3 weeks",description:"Every pull request gets a preview environment, tests run automatically, and main deploys to production with a rollback path.",tech:["GitHub Actions","Docker","AWS ECS","Terraform"],outcome:"A repo where a PR produces a live preview URL in under 5 minutes.",steps:["Containerise the app with a multi-stage Dockerfile.","Write a workflow: lint → test → build → push image.","Provision ECS/Fargate services with Terraform.","Add a preview job that deploys per-PR with a unique subdomain.","Add health checks and automatic rollback on failed deploy.","Document secrets, environments and the rollback runbook."],tags:["DevOps","CI/CD","Docker"]},{id:"p-cost-optimiser",title:"Cloud Cost Optimiser",category:"Cloud",difficulty:"Advanced",duration:"3 weeks",description:"Pull billing data, find idle resources and unused storage, and produce savings recommendations with estimated monthly impact.",tech:["Python","boto3","AWS Cost Explorer","Streamlit"],outcome:"A tool that identifies at least 5 savings opportunities on a test account.",steps:["Enable Cost Explorer and pull 90 days of usage by service.","Detect idle EC2 instances, unattached EBS volumes and old snapshots.","Query CloudWatch for under-utilised instances.","Estimate savings per recommendation with a confidence level.","Build a Streamlit report with one-click export.","Apply one safe change and verify the billing delta."],tags:["FinOps","boto3","Analysis"]},{id:"p-k8s-platform",title:"Kubernetes Platform on a Budget",category:"Cloud",difficulty:"Advanced",duration:"4 weeks",description:"Run a small production-shaped platform: ingress, TLS, autoscaling, secrets and observability on a single-node or two-node cluster.",tech:["Kubernetes","Helm","cert-manager","Prometheus","Grafana"],outcome:"A cluster serving 3 services with autoscaling, TLS and dashboards.",steps:["Provision a small cluster (k3s on a VM or a managed free tier).","Deploy ingress-nginx and cert-manager with Let’s Encrypt.","Package one service as a Helm chart with values per environment.","Add HPA based on CPU and request rate.","Install Prometheus + Grafana and build a service dashboard.","Simulate a load spike and prove autoscaling works."],tags:["Kubernetes","Observability","Helm"]},{id:"p-backup-dr",title:"Backup & Disaster Recovery Drill",category:"Cloud",difficulty:"Intermediate",duration:"2 weeks",description:"Design a backup strategy for a small app, automate it, then actually restore from it and measure recovery time and data loss.",tech:["AWS S3","RDS snapshots","Bash","Terraform"],outcome:"A documented RTO/RPO with a successful timed restore from a simulated failure.",steps:["Inventory what must be backed up and how often.","Automate database snapshots and object storage versioning.","Encrypt backups and set lifecycle retention rules.","Simulate data loss and restore to a fresh environment.","Measure recovery time against the target RTO.","Write the runbook and schedule a quarterly drill."],tags:["Reliability","Backups","Runbook"]},{id:"p-multi-tenant",title:"Multi-tenant SaaS Deployment",category:"Cloud",difficulty:"Beginner",duration:"2 weeks",description:"Deploy the same app for three fictional tenants with separate databases, custom domains and isolated environments.",tech:["Docker","Nginx","PostgreSQL","Cloudflare"],outcome:"Three live subdomains served from one codebase with isolated data.",steps:["Containerise the app and parameterise configuration.","Create one database per tenant with separate credentials.","Configure Nginx virtual hosts per subdomain.","Automate provisioning with a shell script.","Add TLS via Let’s Encrypt.","Verify tenant isolation with a data-access test."],tags:["Docker","Nginx","SaaS"]},{id:"p-phishing-detector",title:"Phishing Email Detector",category:"Cybersecurity",difficulty:"Beginner",duration:"1–2 weeks",description:"Scan email headers and body for phishing signals: mismatched reply-to, lookalike domains, urgency language and suspicious links.",tech:["Python","regex","scikit-learn","Flask"],outcome:"A tool that flags 85%+ of a test set of 50 phishing emails with few false positives.",steps:["Collect 50 phishing and 50 legitimate emails for testing.","Extract header features (SPF/DKIM results, reply-to mismatch).","Extract body features (URLs, urgency keywords, HTML tricks).","Score with rules, then train a simple classifier as a comparison.","Expose it via a Flask page for pasting raw emails.","Report false-positive rate honestly."],tags:["Phishing","Email","ML"]},{id:"p-vuln-scanner",title:"Web Vulnerability Scanner",category:"Cybersecurity",difficulty:"Intermediate",duration:"3 weeks",description:"A scanner that tests a target you own for the OWASP basics: reflected XSS, SQL injection patterns, missing headers and open directories.",tech:["Python","requests","BeautifulSoup","Docker"],outcome:"A report on a deliberately vulnerable lab app (DVWA) with reproducible findings.",steps:["Set up DVWA locally — only scan systems you own.","Crawl the target and enumerate forms and parameters.","Test payloads for reflected XSS and SQLi error patterns.","Check security headers and cookie flags.","Classify findings by severity and add remediation advice.","Generate a clean HTML/PDF report."],tags:["OWASP","AppSec","Ethics"]},{id:"p-network-monitor",title:"Home Network Intrusion Monitor",category:"Cybersecurity",difficulty:"Intermediate",duration:"2 weeks",description:"Capture traffic on your own network, baseline normal devices and alert on unknown devices or unusual outbound connections.",tech:["Python","Scapy","Wireshark","SQLite"],outcome:"A 7-day baseline with an alert when a new device joins the network.",steps:["Capture traffic with Scapy on your own network only.","Build a device inventory from ARP/DHCP observations.","Store observations in SQLite with timestamps.","Define a baseline of known devices and normal destinations.","Alert on new MAC addresses or rare outbound hosts.","Visualise device activity over a week."],tags:["Network Security","Scapy","Monitoring"]},{id:"p-secure-auth",title:"Secure Authentication Implementation",category:"Cybersecurity",difficulty:"Beginner",duration:"1–2 weeks",description:"Implement signup/login the right way — hashed passwords, rate limiting, session handling, CSRF protection — and document the attacks it stops.",tech:["Node.js","bcrypt","Express","PostgreSQL"],outcome:"A working auth flow that resists credential stuffing and session fixation tests.",steps:["Hash passwords with bcrypt and enforce strength rules.","Add rate limiting and account lockout after failed attempts.","Use httpOnly, secure, sameSite cookies for sessions.","Add CSRF tokens on state-changing routes.","Write tests that attempt common attacks.","Document each control and the threat it mitigates."],tags:["Auth","AppSec","Node.js"]},{id:"p-siem-lab",title:"Mini SIEM & Detection Lab",category:"Cybersecurity",difficulty:"Advanced",duration:"4 weeks",description:"Collect logs from a lab machine, write detections for brute force and lateral movement, and produce a triage runbook.",tech:["ELK Stack","Suricata","Sysmon","Docker"],outcome:"Five working detections firing on simulated attacks with a triage runbook.",steps:["Stand up ELK with Docker Compose.","Ship Sysmon and auth logs from a Windows/Linux lab VM.","Write detection rules for failed logins, privilege escalation and new services.","Simulate attacks on your own lab and confirm alerts fire.","Tune out false positives from normal activity.","Write the L1 triage runbook for each detection."],tags:["SIEM","Detection Engineering","ELK"]},{id:"p-threat-model",title:"Threat Model for a College App",category:"Cybersecurity",difficulty:"Advanced",duration:"2 weeks",description:"Produce a full threat model for a real student-facing app using STRIDE: assets, trust boundaries, threats and mitigations.",tech:["STRIDE","OWASP Threat Dragon","Draw.io"],outcome:"A 10-page threat model with a prioritised mitigation backlog.",steps:["Interview a developer or read the app’s architecture.","Draw the data-flow diagram with trust boundaries.","Enumerate threats per STRIDE category.","Score with DREAD or CVSS-style ratings.","Map mitigations to concrete engineering tickets.","Present findings to the team and track fixes."],tags:["Threat Modeling","STRIDE","GRC"]}],Zy=e=>ma.find(t=>t.id===e),ev=["All","DSA","Web Development","Data & SQL","AI/ML","Cloud","Cybersecurity"],fl=[{id:"t1",track:"DSA",difficulty:"Easy",q:"What is the time complexity of binary search, and what must be true about the input?",a:"O(log n). The array must be sorted (or otherwise monotonic) so that each comparison eliminates half the remaining search space. Space complexity is O(1) iteratively, O(log n) with recursion due to the call stack."},{id:"t2",track:"DSA",difficulty:"Easy",q:"Array vs linked list — when would you choose each?",a:"Arrays give O(1) random access and better cache locality but O(n) insertion/deletion in the middle and fixed capacity. Linked lists give O(1) insert/delete given a node reference but O(n) access and extra memory per node. Choose arrays for read-heavy, index-based work; lists for frequent mid-sequence insertion with few reads."},{id:"t3",track:"DSA",difficulty:"Medium",q:"How would you detect a cycle in a linked list?",a:"Floyd’s tortoise and hare: advance one pointer by one node and another by two. If they meet, a cycle exists. To find the cycle start, reset one pointer to the head and advance both one step at a time; the meeting point is the cycle entry. O(n) time, O(1) space."},{id:"t4",track:"DSA",difficulty:"Medium",q:"Explain dynamic programming using the coin change problem.",a:"Define dp[amount] = minimum coins to make that amount. Base case dp[0] = 0, others infinity. For each amount, dp[a] = min(dp[a - coin] + 1) over all coins. Fill bottom-up. O(amount × coins) time. The key insight is overlapping subproblems and optimal substructure — the same sub-amount is reused across branches."},{id:"t5",track:"DSA",difficulty:"Hard",q:"Design a data structure supporting insert, delete and getRandom in O(1).",a:"Combine a dynamic array with a hash map from value to index. Insert appends to the array and records the index. Delete swaps the target with the last element, updates the swapped element’s index, then pops. getRandom picks a random index in the array. All three are O(1) average."},{id:"t6",track:"Web Development",difficulty:"Easy",q:"What is the difference between == and === in JavaScript?",a:'== performs type coercion before comparing ("5" == 5 is true). === compares value and type without coercion ("5" === 5 is false). Use === by default; it avoids surprising coercions such as null == undefined being true.'},{id:"t7",track:"Web Development",difficulty:"Medium",q:"How does the React virtual DOM improve performance?",a:"React keeps a lightweight tree of elements in memory. On state change it re-renders that tree, diffs it against the previous one, and applies only the minimal set of real DOM mutations. Real DOM operations are expensive; batching and minimal patching reduce layout and paint work. Note it is not automatically faster than hand-written DOM code — it makes predictable updates cheap to write."},{id:"t8",track:"Web Development",difficulty:"Medium",q:"Explain the event loop, microtasks and macrotasks.",a:"JavaScript runs on a single thread with a call stack. Async work is handed to the host (browser/Node). When the stack empties, the loop drains the microtask queue completely (promises, queueMicrotask), then takes one macrotask (timers, I/O callbacks), then repeats. That is why a resolved promise callback runs before a setTimeout(0)."},{id:"t9",track:"Web Development",difficulty:"Medium",q:"What is CORS and why does it exist?",a:"Cross-Origin Resource Sharing is a browser-enforced policy that blocks reading responses from a different origin unless the server explicitly allows it via Access-Control-Allow-* headers. It exists to stop a malicious site from reading authenticated data from another site using the user’s cookies. Preflight OPTIONS requests check non-simple requests first. CORS is not server-side security — it protects users in browsers."},{id:"t10",track:"Web Development",difficulty:"Hard",q:"How would you optimise a React app that feels slow?",a:"Measure first with the React Profiler and Lighthouse. Then: split bundles by route, memoise expensive computations with useMemo, avoid recreating callbacks that break memo, virtualise long lists, move state down to reduce re-render scope, lazy-load images, and fix layout thrash from synchronous reads/writes. Verify the improvement with a before/after profile rather than assuming."},{id:"t11",track:"Data & SQL",difficulty:"Easy",q:"What is the difference between WHERE and HAVING?",a:"WHERE filters rows before grouping; HAVING filters groups after aggregation. So WHERE cannot reference aggregate functions like COUNT(*), while HAVING can. WHERE also runs earlier and can use indexes, so it is usually cheaper."},{id:"t12",track:"Data & SQL",difficulty:"Medium",q:"Explain the difference between INNER, LEFT and FULL OUTER JOIN.",a:"INNER returns rows with matches on both sides. LEFT returns all left rows plus matches, with NULLs where there is none. FULL OUTER returns all rows from both sides with NULLs where either side is missing. A common mistake is filtering the right table in WHERE after a LEFT JOIN, which silently turns it into an INNER JOIN."},{id:"t13",track:"Data & SQL",difficulty:"Medium",q:"How do indexes speed up queries, and what do they cost?",a:"A B-tree index lets the engine find rows without a full scan, turning O(n) lookups into O(log n). Costs: extra storage, slower writes (every INSERT/UPDATE maintains the index), and planner overhead. Composite indexes only help when queries use the leading columns. Covering indexes can avoid table lookups entirely."},{id:"t14",track:"Data & SQL",difficulty:"Medium",q:"A metric dropped 20% overnight. How do you investigate?",a:"First check it is real: is the pipeline fresh, did the definition change, is there a partial day? Then segment — by platform, geography, version, new vs returning users, channel — to localise it. Compare with a control metric that should have moved too. Then look at release history, third-party outages, and tracking breakage. Only after ruling those out consider a genuine behavioural cause."},{id:"t15",track:"AI/ML",difficulty:"Easy",q:"What is overfitting and how do you detect it?",a:"The model learns noise specific to the training set and fails to generalise. Detect it when training loss keeps falling while validation loss rises, or when validation metrics are much worse than training metrics. Mitigate with more data, augmentation, regularisation (L2, dropout), early stopping, simpler models, or cross-validation."},{id:"t16",track:"AI/ML",difficulty:"Medium",q:"Precision vs recall — which matters more for fraud detection?",a:"It depends on the cost of each error. For fraud, a false negative (missed fraud) is usually far costlier than a false positive (an extra manual review), so recall is prioritised — often at the expense of precision. In spam filtering the reverse can hold. Report the precision-recall curve and pick a threshold from the business cost, not a default 0.5."},{id:"t17",track:"AI/ML",difficulty:"Medium",q:"How does a RAG system reduce hallucinations?",a:"Retrieval-Augmented Generation fetches relevant documents and puts them in the prompt, so the model conditions on real text instead of only its parameters. Hallucination drops but does not vanish — the model can still misread or ignore context. Grounding is strengthened by citation requirements, refusal instructions when context is insufficient, chunk quality, and an evaluation set that measures faithfulness."},{id:"t18",track:"AI/ML",difficulty:"Hard",q:"Your model has 95% accuracy on a dataset where 95% of rows are negative. Is it good?",a:'No — a model predicting "negative" always scores 95%. This is the class-imbalance trap. Look at precision, recall, F1 and the confusion matrix, and compare against that trivial baseline. Use stratified splits, class weights or resampling, and choose metrics tied to the decision cost.'},{id:"t19",track:"Cloud",difficulty:"Easy",q:"What is the difference between a security group and a network ACL in AWS?",a:"Security groups are stateful, instance-level firewalls: return traffic is automatically allowed, and only allow rules exist. Network ACLs are stateless, subnet-level and support both allow and deny rules, so you must define inbound and outbound explicitly. Use security groups for most control; NACLs for coarse subnet-level blocking."},{id:"t20",track:"Cloud",difficulty:"Medium",q:"Explain horizontal vs vertical scaling with trade-offs.",a:"Vertical scaling means a bigger machine — simple, no code change, but a hard ceiling and often downtime to resize. Horizontal scaling means more machines — near-limitless and resilient, but requires stateless services, load balancing and distributed data handling. Most cloud designs scale horizontally and treat vertical scaling as a stopgap."},{id:"t21",track:"Cloud",difficulty:"Medium",q:"What problem does a load balancer solve?",a:"It distributes traffic across healthy instances, provides a single stable endpoint, performs health checks and removes failing nodes, and can terminate TLS. It enables horizontal scaling and rolling deployments without downtime. Beyond that it may add sticky sessions, path routing or WAF rules."},{id:"t22",track:"Cloud",difficulty:"Hard",q:"How would you design a highly available three-tier app on AWS?",a:"Route 53 → ALB across at least two availability zones → auto-scaling EC2 or ECS tasks in private subnets → RDS Multi-AZ with read replicas → ElastiCache for sessions. Static assets on S3 + CloudFront. Secrets in Secrets Manager, IAM roles least-privilege, and observability with CloudWatch plus alarms. Define RTO/RPO and test failover rather than assuming it works."},{id:"t23",track:"Cybersecurity",difficulty:"Easy",q:"Difference between authentication and authorisation?",a:"Authentication proves who you are (login, password, MFA). Authorisation decides what you may do once identified (roles, permissions, policies). A system can authenticate you successfully and still deny the action you requested — that is correct behaviour, not a bug."},{id:"t24",track:"Cybersecurity",difficulty:"Medium",q:"How does SQL injection work and how do you prevent it?",a:`Untrusted input is concatenated into a query, so the input can change the query’s structure ("' OR 1=1 --"). Prevent it with parameterised queries or prepared statements, which keep data separate from SQL. Add defence in depth: least-privilege database users, input validation, ORM use, and WAF rules. Escaping alone is fragile.`},{id:"t25",track:"Cybersecurity",difficulty:"Medium",q:"Explain XSS: stored, reflected and DOM-based.",a:"XSS runs attacker JavaScript in a victim’s browser. Stored XSS persists in the database (a comment field) and hits every viewer. Reflected XSS comes from the current request (a crafted URL parameter). DOM-based XSS happens entirely client-side when code writes untrusted data into the DOM. Defence: contextual output encoding, a strict Content-Security-Policy, avoiding innerHTML, and HttpOnly cookies."},{id:"t26",track:"Cybersecurity",difficulty:"Hard",q:"You suspect a server is compromised. What are your first five steps?",a:"1) Isolate it from the network without destroying evidence (security group change, not a wipe). 2) Preserve volatile evidence — memory, running processes, network connections, logs. 3) Identify scope: how it got in, what credentials or data were touched. 4) Eradicate and rebuild from a known-good image rather than cleaning in place. 5) Rotate credentials, notify per policy, then write the post-incident report and add detections."}],gl=[{id:"h1",q:"Tell me about yourself.",hint:"90 seconds max: who you are, what you have built, why this role.",sample:"I’m a final-year Computer Science student at NIT Surat. I’ve spent the last year building full-stack products — my most recent is a campus event platform used by about 600 students. I enjoy the part where a messy requirement becomes a working flow, and I want to do that at scale as a frontend engineer."},{id:"h2",q:"Why should we hire you?",hint:"Match three of their requirements to three things you have actually done.",sample:"Your JD asks for React, API integration and someone who can own a feature end to end. I’ve shipped three React apps with Node APIs, one with real users, and I worked independently on the entire release cycle for my college fest portal."},{id:"h3",q:"What is your biggest weakness?",hint:'A real one, plus the system you built to manage it. Never "I’m a perfectionist".',sample:"I used to over-scope projects and miss deadlines. Now I break work into one-week slices with a demo at the end of each, which forces me to cut scope early instead of discovering it late."},{id:"h4",q:"Describe a project you are proud of.",hint:"Problem → your specific contribution → hard decision → measurable outcome.",sample:"Our mess-feedback app had 40 daily users on a bad form. I rebuilt the flow to three taps, added offline support, and daily submissions rose to about 250 within a month. The hard part was making it work on 2G in the hostel."},{id:"h5",q:"Tell me about a time you disagreed with a teammate.",hint:"Show the disagreement, how you listened, and how it was resolved — not that you were right.",sample:"My teammate wanted to add a chat feature two weeks before submission. I thought it was risky. We listed what each feature cost in days and agreed to ship without chat but with a better search. We delivered on time and the search got used more than chat would have."},{id:"h6",q:"Where do you see yourself in five years?",hint:"Honest, ambitious, and consistent with the role you are applying for.",sample:"In five years I want to be a strong product-minded engineer — someone who can own a service end to end and mentor juniors. That means going deep in backend and system design over the next two years, then taking on larger ownership."},{id:"h7",q:"How do you handle pressure during deadlines?",hint:'Describe a concrete method, not "I stay calm".',sample:"I triage by what actually breaks if it slips. During my final project I cut a feature, shipped the core, and told my guide early. I keep a short list of what is blocked and who I need — that stops pressure turning into silence."},{id:"h8",q:"Why do you want to work here?",hint:"Specific product detail + something about how you work. Generic praise fails.",sample:"I use your app for tracking expenses and I noticed you ship weekly and write public post-mortems. That matches how I like to work — small releases, honest retrospectives. I also want to work on a product with real Indian users."},{id:"h9",q:"What do you do outside academics?",hint:"Show a genuine interest with evidence of commitment.",sample:"I play badminton four times a week and I run a small study group for data structures with six juniors. Both keep me consistent — I like things I have to show up for regularly."},{id:"h10",q:"Do you have any questions for us?",hint:"Always yes. Ask about the team, the work or growth — never only about salary.",sample:"Two things: what does the first six months look like for someone in this role, and how does the team decide what to build next quarter?"}],tv=[{title:"Structure & length",icon:"FileText",tips:["One page for a fresher. Two only if you have 3+ years of experience.","Order: header, education, skills, projects, experience/internships, achievements.","Use a single-column layout — most ATS parsers mangle two-column designs.","Export as PDF with a text-based name like Aryan_Shetty_Frontend.pdf."]},{title:"Bullet points that work",icon:"ListChecks",tips:["Start with an action verb: Built, Reduced, Automated, Migrated.",'Quantify: "cut page load from 4.2s to 1.3s" beats "improved performance".',"One line per bullet, two at most. Cut adjectives, keep outcomes.",'Say what you specifically did — "I" is implied, teams dilute credit.']},{title:"Projects that get read",icon:"FolderGit2",tips:["Two to three projects, each with a live link and a GitHub repo.","Add the problem in one clause, then your contribution, then the result.","List the actual stack you used, not every technology you have heard of.",'Include users or metrics if you have any — even "used by 40 classmates".']},{title:"Skills section",icon:"Wrench",tips:["Group by category: Languages, Frameworks, Tools, Databases.","Only list what you can defend in an interview for 5 minutes.","Mirror the JD’s exact keywords — ATS matches strings, not synonyms.","Skip soft-skill lists and progress bars; both waste space."]},{title:"Common rejections",icon:"AlertTriangle",tips:["Typos in the company name or your own email.","A photo, date of birth or marital status (not required in India, often filtered).","Dense walls of text with no white space.","A GitHub with no READMEs — reviewers do click through."]}],nv=["Quantitative","Logical Reasoning","Verbal"],Qc=[{id:"a1",topic:"Quantitative",difficulty:"Easy",q:"A train 150 m long runs at 54 km/h. How long does it take to pass a pole?",options:["8 seconds","10 seconds","12 seconds","15 seconds"],answer:1,explanation:"54 km/h = 54 × 5/18 = 15 m/s. Time = 150 / 15 = 10 seconds."},{id:"a2",topic:"Quantitative",difficulty:"Easy",q:"If a shirt priced at ₹1,200 is sold at a 15% discount, what is the selling price?",options:["₹960","₹1,020","₹1,050","₹1,080"],answer:1,explanation:"Discount = 15% of 1200 = ₹180. Selling price = 1200 − 180 = ₹1,020."},{id:"a3",topic:"Quantitative",difficulty:"Medium",q:"A can do a job in 12 days and B in 18 days. Working together, how many days will they take?",options:["6.5 days","7.2 days","7.5 days","8 days"],answer:1,explanation:"Combined rate = 1/12 + 1/18 = 3/36 + 2/36 = 5/36 per day. Time = 36/5 = 7.2 days."},{id:"a4",topic:"Quantitative",difficulty:"Medium",q:"The average of 5 numbers is 27. If one number is removed the average becomes 25. What was removed?",options:["25","30","35","37"],answer:2,explanation:"Total = 5 × 27 = 135. New total = 4 × 25 = 100. Removed = 135 − 100 = 35."},{id:"a5",topic:"Quantitative",difficulty:"Hard",q:"A sum doubles in 8 years at simple interest. In how many years will it become four times?",options:["16 years","20 years","24 years","32 years"],answer:2,explanation:"Doubling means interest = principal in 8 years, so rate = 12.5% p.a. For 4×, interest must be 3× principal: 3 × 8 = 24 years."},{id:"a6",topic:"Logical Reasoning",difficulty:"Easy",q:"Find the next number: 2, 6, 12, 20, 30, ?",options:["36","40","42","44"],answer:2,explanation:"Differences are 4, 6, 8, 10 → next difference 12. 30 + 12 = 42. (P
